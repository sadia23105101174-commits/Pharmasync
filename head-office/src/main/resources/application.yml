server:
  port: 8080

spring:
  application:
    name: head-office
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmasync_ho}
    username: ${DB_USER:pharmasync}
    password: ${DB_PASSWORD:pharmasync}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

pharmasync:
  security:
    branch-credentials: ${BRANCH_DEVICE_CREDENTIALS:BRANCH-001:branch-secret-001,BRANCH-002:branch-secret-002}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
