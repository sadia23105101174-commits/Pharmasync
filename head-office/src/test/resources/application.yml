server:
  port: 8080

spring:
  application:
    name: head-office-test
  datasource:
    url: jdbc:h2:mem:headofficetestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

pharmasync:
  security:
    branch-credentials: ${BRANCH_DEVICE_CREDENTIALS:BRANCH-001:branch-secret-001,BRANCH-002:branch-secret-002}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
