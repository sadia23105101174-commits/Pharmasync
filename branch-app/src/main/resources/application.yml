server:
  port: 8081

branch:
  id: BRANCH-001
  name: "Downtown Central Pharmacy"

pharmasync:
  sync:
    server-url: ${HO_SYNC_URL:http://localhost:8080}
    device-secret: ${BRANCH_DEVICE_SECRET:}

spring:
  application:
    name: branch-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmasync_ho}
    username: ${DB_USER:pharmasync}
    password: ${DB_PASSWORD:pharmasync}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
